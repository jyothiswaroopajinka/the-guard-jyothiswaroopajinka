name: The Guard — Eval CI/CD Gate

# Runs on every PR that touches a prompt file, model config, or eval data.
# Blocks the PR if the eval gate returns NO-GO (exit code 1).

on:
  pull_request:
    paths:
      - "prompts/**"
      - "src/providers.py"
      - "data/**"
      - "run_eval.py"
      - "src/tasks/**"
      - "src/scorers/**"

jobs:
  eval-gate:
    name: Run Eval Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eval (quick mode — 5 cases per task, no judge to save API cost in CI)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python run_eval.py \
            --baseline-provider anthropic \
            --baseline-prompt v1.txt \
            --candidate-provider openai \
            --candidate-prompt v1.txt \
            --quick
        # Exit code 0 = GO (PR passes)
        # Exit code 1 = NO-GO (PR blocked)
        # Exit code 2 = INCONCLUSIVE (PR passes with warning)

      - name: Upload eval results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: eval_results/
          retention-days: 30

      - name: Comment on PR with eval summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Find the latest result file
            const resultsDir = 'eval_results';
            let summary = '### The Guard — Eval Results\n\n';

            try {
              const files = fs.readdirSync(resultsDir)
                .filter(f => f.startsWith('run_') && f.endsWith('.json'))
                .sort().reverse();

              if (files.length > 0) {
                const latest = JSON.parse(fs.readFileSync(path.join(resultsDir, files[0]), 'utf8'));
                const decision = latest.gate_decision;
                const emoji = decision === 'GO' ? '✅' : (decision === 'NO-GO' ? '🚫' : '⚠️');

                summary += `**Decision: ${emoji} ${decision}**\n\n`;
                summary += '```\n' + (latest.gate_summary || 'No summary available') + '\n```\n';
              } else {
                summary += '_No result files found_\n';
              }
            } catch (e) {
              summary += `_Could not read results: ${e.message}_\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
